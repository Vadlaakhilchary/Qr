{% extends "base.html" %}

{% block title %}Login - QRStudio{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card" style="border: 1px solid #f5e8df;">
        <h2 class="text-center" style="margin-bottom: 2rem; color: #2c2c2c;">Login to QRStudio</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label style="display: flex; align-items: center; font-weight: 400;">
                    <input type="checkbox" name="remember" style="width: auto; margin-right: 0.5rem;">
                    Remember me
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Login</button>
        </form>
        
        <p class="text-center" style="margin-top: 1.5rem; color: #8b7d6b; font-size: 0.95rem;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: #d97757; font-weight: 600; text-decoration: none;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
