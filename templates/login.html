{% extends "base.html" %}

{% block title %}Login - QR Code Manager{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 class="text-center" style="margin-bottom: 2rem; color: #333;">Login</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" name="remember" style="width: auto;">
                    Remember me
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        
        <p class="text-center" style="margin-top: 1.5rem; color: #666;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: #667eea;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
