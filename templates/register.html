{% extends "base.html" %}

{% block title %}Register - QRStudio{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card" style="border: 1px solid #f5e8df;">
        <h2 class="text-center" style="margin-bottom: 2rem; color: #2c2c2c;">Create Your QRStudio Account</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required minlength="3">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
        </form>
        
        <p class="text-center" style="margin-top: 1.5rem; color: #8b7d6b; font-size: 0.95rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: #d97757; font-weight: 600; text-decoration: none;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
